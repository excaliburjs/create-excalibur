name: Release to NPM
on:
  release:
    types: [published]

jobs:
  deploy_release:
    name: Publish npm package
    runs-on: [ubuntu-latest]
    # Trusted publishing (OIDC): npm authenticates via the workflow's identity —
    # no NPM_TOKEN secret. Requires the trusted publisher to be configured for
    # create-excalibur on npmjs.com (repo excaliburjs/create-excalibur,
    # workflow release.yml).
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        registry-url: 'https://registry.npmjs.org'
        cache: npm
    # OIDC trusted publishing and staged publishes need npm >= 11.5.1
    # (same pin as excaliburjs/Excalibur's release workflow)
    - run: npm install -g npm@11.16.0
    - run: npm ci
    - run: npm run typecheck
    - run: npm test
    - run: npm run smoke:pack
    # Staged publish with provenance: the version is staged on npmjs (prepack
    # builds dist/), then promoted to public from the npm UI / npm CLI.
    - run: npm stage publish --provenance
