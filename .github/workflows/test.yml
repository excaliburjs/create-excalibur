name: Test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke:pack

  engines-floor:
    name: dist runs on Node 20.10 (engines floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Dev tooling needs modern Node (type stripping); the SHIPPED dist must
      # run on the engines floor — prove it by executing the build there.
      - uses: actions/setup-node@v4
        with:
          node-version: '20.10'
      - run: node dist/index.js --help
      - run: node dist/index.js docs --help
